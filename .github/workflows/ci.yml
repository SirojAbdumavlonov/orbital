name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Engine tests (incl. live SSH)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Start disposable sshd
        run: |
          sudo apt-get update && sudo apt-get install -y openssh-server ufw fail2ban certbot python3-venv nginx
          sudo KEYDIR=/tmp/orbital-it-keys bash scripts/it-sshd.sh | tee /tmp/it-env
      - name: Start FTP, WebDAV and S3 test servers
        run: bash scripts/it-storage.sh | tail -n 1 | tee -a /tmp/it-env
      - name: Prepare ufw, fail2ban and nginx for the live tests
        # The runner keeps accepting everything (default allow), so enabling
        # ufw can't cut it off; fail2ban runs its stock sshd jail.
        run: |
          sudo ufw default allow incoming
          sudo ufw --force enable
          sudo systemctl restart fail2ban
          sleep 2
          sudo fail2ban-client status
          sudo systemctl start nginx
          echo 'export ORBITAL_IT_UFW=1 ORBITAL_IT_FAIL2BAN=1 ORBITAL_IT_USERS=1 ORBITAL_IT_NGINX=1' >> /tmp/it-env
      - name: Clippy
        run: cargo clippy -p orbital-core --all-targets -- -D warnings
      - name: Test
        run: |
          source /tmp/it-env
          cargo test -p orbital-core -- --test-threads=1

  frontend:
    name: Frontend (types, unit tests, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  macos:
    name: macOS app bundle
    needs: [core, frontend]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Clippy (app crate)
        run: cargo clippy -p orbital --all-targets -- -D warnings
      - name: Build universal .app / .dmg
        run: npm run tauri build -- --target universal-apple-darwin
        # For signed + notarized releases add APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
        # APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID as repository secrets.
      - uses: actions/upload-artifact@v4
        with:
          name: Orbital-macos
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg

  windows:
    name: Windows engine tests and installer
    needs: [core, frontend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Live tests need a Linux sshd; the unit tests and the mock DNS test run anywhere.
      - name: Engine unit tests
        run: cargo test -p orbital-core --lib --test dns_mock
      - name: Clippy (engine and app crate)
        run: cargo clippy -p orbital-core -p orbital --all-targets -- -D warnings
      - name: Build the installer
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: Orbital-windows
          path: target/release/bundle/nsis/*.exe

  linux:
    name: Linux packages (.deb, .rpm, AppImage) and install test
    needs: [core, frontend]
    # The oldest supported Ubuntu, so the packages run on its glibc and newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - name: System libraries (WebKitGTK, bundling, headless test)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev patchelf rpm file xvfb dbus dbus-x11 desktop-file-utils
      - run: npm ci
      - name: Clippy (app crate)
        run: cargo clippy -p orbital --all-targets -- -D warnings
      - name: App crate tests (data folder, migration)
        run: cargo test -p orbital --lib
      - name: Engine unit tests (incl. this machine's ID for the vault)
        run: cargo test -p orbital-core --lib vault
      - name: Build the packages
        run: npm run tauri build -- --bundles "$(bash scripts/linux-bundles.sh)"
        # linuxdeploy (for the AppImage) is itself an AppImage; this lets it run without FUSE.
        env: { APPIMAGE_EXTRACT_AND_RUN: 1 }
      - name: Install, start and remove the .deb (headless)
        run: bash scripts/linux-smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Orbital-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
