[package]
name = "orbital-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Orbital engine: SSH/SFTP sessions, server inspection, safe config edits and tamper-evident audit log"

[dependencies]
russh = "0.65"
russh-sftp = "3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.43", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
once_cell = "1"
tracing = "0.1"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
zeroize = "1"
chacha20poly1305 = "0.10"
suppaftp = { version = "12", features = ["tokio", "tokio-rustls-ring"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
roxmltree = "0.20"
hmac = "0.12"
httpdate = "1"
url = "2"
futures-util = "0.3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "hostname", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }
tokio-util = { version = "0.7", features = ["io"] }
percent-encoding = "2"
x509-parser = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSError", "NSString"] }
objc2-local-authentication = { version = "0.3", features = ["LAContext", "block2"] }

[dev-dependencies]
tempfile = "3"
base64 = "0.22"
